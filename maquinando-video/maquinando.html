<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<title>Maquinando Intro</title>
<style>
@font-face{font-family:BC;font-weight:600;src:url(fonts/barlow-condensed-latin-600-normal.woff2)}
@font-face{font-family:BC;font-weight:700;src:url(fonts/barlow-condensed-latin-700-normal.woff2)}
@font-face{font-family:BC;font-weight:800;src:url(fonts/barlow-condensed-latin-800-normal.woff2)}
@font-face{font-family:DM;font-weight:400;src:url(fonts/dm-sans-latin-400-normal.woff2)}
@font-face{font-family:DM;font-weight:500;src:url(fonts/dm-sans-latin-500-normal.woff2)}
@font-face{font-family:DM;font-weight:600;src:url(fonts/dm-sans-latin-600-normal.woff2)}
:root{
  --bg:#101110;      /* theme-color de andomaquinando.com */
  --ink:#F2F0EA;     /* PROVISIONAL: claro */
  --accent:#FF5A1F;  /* PROVISIONAL: acento */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:DM}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.bc{font-family:BC;font-weight:800;text-transform:uppercase;line-height:.9;letter-spacing:-.005em}
.micro{font-family:DM;font-weight:500;font-size:22px;letter-spacing:.18em;text-transform:uppercase}
.center{left:0;right:0;text-align:center}
.caret{display:inline-block;width:.06em;height:.78em;background:var(--accent);margin-left:.05em;vertical-align:-.02em}
.dot{color:var(--accent)}
.line{position:absolute;background:currentColor;opacity:.25}
.mask{overflow:hidden;display:block}
.mask>span{display:inline-block}
.node{position:absolute;width:12px;height:12px;border:2px solid currentColor;background:transparent;transform:translate(-50%,-50%);opacity:.6}
</style>
</head>
<body>
<div id="stage">

  <!-- 1 HOLA -->
  <div class="scene" id="s1">
    <div class="line" id="s1h1" style="height:2px;top:760px;left:0"></div>
    <div class="line" id="s1h2" style="height:2px;top:1000px;left:0"></div>
    <div class="line" id="s1v1" style="width:2px;left:250px;top:0"></div>
    <div class="line" id="s1v2" style="width:2px;left:830px;top:0"></div>
    <div class="node" style="left:250px;top:760px"></div><div class="node" style="left:830px;top:760px"></div>
    <div class="node" style="left:250px;top:1000px"></div><div class="node" style="left:830px;top:1000px"></div>
    <div class="abs micro" id="s1m1" style="left:262px;top:722px;font-size:18px;opacity:.6">X 250</div>
    <div class="abs micro" id="s1m2" style="left:700px;top:722px;font-size:18px;opacity:.6">X 830</div>
    <div class="abs micro" id="s1m3" style="left:262px;top:1012px;font-size:18px;opacity:.6">240 PX</div>
    <div class="abs bc center" id="s1t" style="top:740px;font-size:280px"></div>
  </div>

  <!-- 2 SOY ERIC -->
  <div class="scene" id="s2">
    <div class="abs bc center" id="s2soy" style="top:640px;font-size:110px;font-weight:700">Soy</div>
    <div class="abs bc center" id="s2name" style="top:790px;font-size:132px;white-space:pre-line"></div>
    <div class="abs micro center" id="s2sub" style="top:1150px">Dirección externa de marketing<br>y comunicación</div>
  </div>

  <!-- 3 ENFOQUE -->
  <div class="scene" id="s3">
    <div class="abs micro" style="left:70px;top:420px;opacity:.6">[ Enfoque ]</div>
    <div class="abs micro" id="s3count" style="right:70px;top:420px;opacity:.6">01 / 04</div>
    <div class="abs center" style="top:810px;height:220px;overflow:hidden">
      <div id="s3roll" class="bc" style="font-size:190px;line-height:220px"></div>
    </div>
  </div>

  <!-- 4 MAQUINANDO -->
  <div class="scene" id="s4">
    <svg class="abs" style="left:0;top:0" width="1080" height="1920"><g fill="none" stroke="currentColor" stroke-opacity=".14" stroke-width="2">
      <circle id="s4c1" cx="540" cy="900" r="300"/><circle id="s4c2" cx="540" cy="900" r="460"/></g></svg>
    <div class="abs bc center" id="s4word" style="top:810px;font-size:196px;height:190px;overflow:hidden;white-space:nowrap"></div>
    <div class="abs micro center" id="s4sub" style="top:1040px">Consultoría de marketing para empresas<br>Lima, Perú</div>
  </div>

  <!-- 5 IDEAS QUE MUEVEN -->
  <div class="scene" id="s5">
    <div class="abs bc center" id="s5a" style="top:660px;font-size:180px">
      <span class="mask"><span>Ideas</span></span>
      <span class="mask"><span>que mueven</span></span>
      <span class="mask"><span class="dot">tu negocio.</span></span>
    </div>
    <div class="abs" id="s5p" style="left:110px;right:110px;top:600px"></div>
  </div>

  <!-- 6 RODILLO -->
  <div class="scene" id="s6">
    <div class="abs micro" style="left:70px;top:420px;opacity:.6">[ Estrategia + acompañamiento ]</div>
    <div class="abs micro" style="right:70px;top:420px;opacity:.6">11</div>
    <div class="abs bc" id="s6lab" style="left:50px;top:910px;font-size:56px;font-weight:700">Maquinamos <span class="dot">●</span></div>
    <div class="abs" id="s6list" style="left:352px;right:40px;top:0;height:1920px;perspective:1100px"></div>
  </div>

  <!-- 7 IDENTIDAD -->
  <div class="scene" id="s7">
    <div class="abs" id="s7b1" style="left:0;right:0;height:640px;top:0;background:var(--bg);color:var(--ink)"></div>
    <div class="abs" id="s7b2" style="left:0;right:0;height:640px;top:640px;background:var(--ink);color:var(--bg)"></div>
    <div class="abs" id="s7b3" style="left:0;right:0;height:640px;top:1280px;background:var(--accent);color:var(--bg)"></div>
  </div>

  <!-- 8 CIERRE -->
  <div class="scene" id="s8">
    <div class="line" id="s8h1" style="height:2px;top:800px;left:0"></div>
    <div class="line" id="s8h2" style="height:2px;top:1000px;left:0"></div>
    <div class="line" id="s8v1" style="width:2px;left:80px;top:0"></div>
    <div class="line" id="s8v2" style="width:2px;left:1000px;top:0"></div>
    <div class="abs bc center" id="s8word" style="top:810px;font-size:196px;white-space:nowrap">Maquinando<span class="dot">.</span></div>
    <div class="abs micro center" id="s8sub" style="top:1040px">Hagamos que avance</div>
    <div class="abs center" id="s8url" style="top:1130px;font-family:DM;font-weight:500;font-size:36px">andomaquinando.com</div>
    <div class="abs micro center" id="s8ig" style="top:1190px;opacity:.55">@maquinandob2b</div>
  </div>

</div>
<script>
const DUR = 31;
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p = (t,a,b)=>clamp((t-a)/(b-a));
const eo = x=>1-Math.pow(1-x,3);
const eio = x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback = x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const css = getComputedStyle(document.documentElement);
const C = {bg:css.getPropertyValue('--bg').trim(), ink:css.getPropertyValue('--ink').trim(), acc:css.getPropertyValue('--accent').trim()};
function show(id,t,a,b,fi=.0,fo=.0){const el=$(id);let o=0;if(t>=a&&t<b){o=1;if(fi>0)o=Math.min(o,p(t,a,a+fi));if(fo>0)o=Math.min(o,1-p(t,b-fo,b));}el.style.opacity=o;return o>0;}
const caret = on => on?'<span class="caret"></span>':'';
const blink = t => Math.floor(t*2.2)%2===0;

/* ---------- escena 6: rodillo, contenido tomado de andomaquinando.com ---------- */
const ITEMS=['Estrategia','Marca','Negocio','Dirección externa','Diagnóstico web','SEO','Contenidos','Propuesta de valor','Marketing por objetivos','Coordinación de equipos','Indicadores'];
const list=$('s6list');
ITEMS.forEach(s=>{const d=document.createElement('div');d.className='abs';d.textContent=s;
  d.style.cssText='left:0;top:0;font-family:DM;font-weight:500;font-size:52px;white-space:nowrap;transform-origin:left center';list.appendChild(d);});

/* ---------- escena 7: bandas de identidad ---------- */
function band(el,label,hex,tone){el.innerHTML=
 `<div class="abs micro" style="left:70px;top:40px;font-size:18px;opacity:.7">${label}</div>
  <div class="abs micro" style="right:70px;top:40px;font-size:18px;opacity:.7;text-align:right">HEX ${hex}</div>
  <div class="abs bc center" style="top:240px;font-size:150px">Maquinando<span style="color:${tone}">.</span></div>`;}
band($('s7b1'),'Base',C.bg,C.acc);band($('s7b2'),'Claro',C.ink,C.acc);band($('s7b3'),'Acento',C.acc,C.ink);

/* ---------- escena 5: pilares ---------- */
const PIL=[['01','Visibilidad'],['02','Claridad'],['03','Dirección']];
$('s5p').innerHTML=PIL.map(([n,w])=>`<div class="pil" style="display:flex;align-items:baseline;gap:28px;border-top:2px solid rgba(242,240,234,.25);padding:26px 0 30px">
  <span class="micro" style="opacity:.6">${n}</span><span class="bc" style="font-size:150px">${w}<span class="dot">.</span></span></div>`).join('');

function typed(str,t,a,rate){const n=Math.floor(clamp((t-a)*rate,0,str.length));return str.slice(0,n);}

function render(t){
  const st=$('stage');
  /* fondo global */
  let bg=C.bg, fg=C.ink;
  if(t>=1.7&&t<6.0){bg=C.ink;fg=C.bg;}
  st.style.background=bg;st.style.color=fg;

  /* 1 HOLA (0 - 2.6) */
  if(show('s1',t,0,2.6)){
    const g=eio(p(t,0,.7));
    $('s1h1').style.width=$('s1h2').style.width=(1080*g)+'px';
    $('s1v1').style.height=$('s1v2').style.height=(1920*g)+'px';
    const gridO=1-p(t,1.7,2.1);
    ['s1h1','s1h2','s1v1','s1v2','s1m1','s1m2','s1m3'].forEach(i=>$(i).style.opacity=(i.startsWith('s1m')?.6:.25)*gridO*p(t,.3,.7));
    document.querySelectorAll('#s1 .node').forEach(n=>n.style.opacity=.6*gridO*p(t,.5,.8));
    const s=typed('HOLA',t,.35,6.5);
    const dotIn=t>1.15;
    const ds=dotIn?eback(p(t,1.15,1.45)):0;
    $('s1t').innerHTML=s+(dotIn?`<span class="dot" style="display:inline-block;transform:scale(${ds})">.</span>`:'')+caret(!dotIn&&blink(t));
    const out=eio(p(t,2.25,2.6));
    $('s1t').style.transform=`translateY(${-140*out}px)`;$('s1t').style.opacity=1-out;
  }

  /* 2 SOY ERIC (2.6 - 6.0) */
  if(show('s2',t,2.6,6.0,0,.25)){
    const a=eo(p(t,2.6,2.95));
    $('s2soy').style.opacity=a;$('s2soy').style.transform=`translateY(${40*(1-a)}px)`;
    const NAME='Eric Mc Farlane', ALT='Tu director de\nmarketing externo';
    let txt, cur;
    if(t<4.3){txt=typed(NAME,t,2.85,16);cur=true;}
    else if(t<4.75){txt=NAME.slice(0,Math.max(0,NAME.length-Math.floor((t-4.3)*36)));cur=true;}
    else {txt=typed(ALT,t,4.8,24);cur=txt.length<ALT.length||blink(t);}
    $('s2name').style.fontSize=(t<4.75?132:118)+'px';
    $('s2soy').textContent=t<4.75?'Soy':'Soy';
    $('s2name').innerHTML=txt.replace('\n','<br>')+caret(cur);
    const sb=t<4.3?eo(p(t,3.75,4.1)):1-p(t,4.3,4.45);
    $('s2sub').style.opacity=sb*.8;$('s2sub').style.letterSpacing=(.18+.12*(1-sb))+'em';
  }

  /* 3 ENFOQUE (6.0 - 9.6) */
  if(show('s3',t,6.0,9.6,.2,.2)){
    const W=['Estrategia','Marca','Negocio','Dirección<br>externa'];
    const roll=$('s3roll');
    if(!roll.dataset.init){roll.innerHTML=W.map((w,i)=>`<div style="height:220px;white-space:nowrap;font-size:${i===3?124:190}px">${w.replace('<br>',' ')}<span class="dot">.</span></div>`).join('');roll.dataset.init=1;}
    const step=.85, base=6.15;
    let k=(t-base)/step; const i=Math.floor(k), f=k-i;
    let pos=clamp(i+eio(clamp((f-.72)/.28)),0,3);
    roll.style.transform=`translateY(${-220*pos}px)`;
    roll.parentElement.style.top='810px';
    $('s3count').textContent='0'+(Math.round(pos)+1)+' / 04';
  }

  /* 4 MAQUINANDO (9.6 - 12.4) */
  if(show('s4',t,9.6,12.4,.15,.25)){
    const word='MAQUINANDO.';
    $('s4word').innerHTML=[...word].map((ch,i)=>{const e=eo(p(t,9.7+i*.06,10.25+i*.06));
      return `<span style="display:inline-block;transform:translateY(${200*(1-e)}px)" ${ch==='.'?'class="dot"':''}>${ch}</span>`}).join('');
    const c=eo(p(t,9.6,10.8));$('s4c1').setAttribute('r',120+180*c);$('s4c2').setAttribute('r',200+260*c);
    const sb=eo(p(t,10.6,11.0));$('s4sub').style.opacity=sb*.75;$('s4sub').style.transform=`translateY(${20*(1-sb)}px)`;
  }

  /* 5 IDEAS (12.4 - 17.2) */
  if(show('s5',t,12.4,17.2,.1,.25)){
    const spans=document.querySelectorAll('#s5a .mask>span');
    spans.forEach((s,i)=>{const e=eo(p(t,12.5+i*.35,13.05+i*.35));const o=eio(p(t,14.7,15.1));
      s.style.transform=`translateY(${(1-e)*110-o*110}%)`;});
    document.querySelectorAll('#s5p .pil').forEach((el,i)=>{const e=eo(p(t,15.0+i*.35,15.5+i*.35));
      el.style.opacity=e;el.style.transform=`translateX(${(1-e)*-60}px)`;});
  }

  /* 6 RODILLO (17.2 - 23.0) */
  if(show('s6',t,17.2,23.0,.2,.25)){
    const lab=eo(p(t,17.2,17.6));$('s6lab').style.opacity=lab;$('s6lab').style.transform=`translateX(${-40*(1-lab)}px)`;
    // avanza un elemento cada 0.48 s con easing
    const step=.48,k=(t-17.45)/step,i=Math.floor(k),f=k-i;
    const pos=clamp(i+eio(clamp(f/.55)),0,ITEMS.length-1);
    const kids=list.children,cy=905,gap=84;
    for(let j=0;j<kids.length;j++){
      const d=j-pos, ad=Math.abs(d);
      const el=kids[j];
      el.style.transform=`translateY(${cy+d*gap-6}px) rotateX(${clamp(d*-14,-70,70)}deg) scale(${1-Math.min(ad,4)*.06})`;
      el.style.opacity=ad>5?0:Math.max(0,1-ad*.24)*(ad<.5?1:.55);
      el.style.color=ad<.5?C.acc:'';
    }
  }

  /* 7 IDENTIDAD (23.0 - 26.4) */
  if(show('s7',t,23.0,26.4,0,.25)){
    [['s7b1',23.0],['s7b2',23.2],['s7b3',23.4]].forEach(([id,a])=>{const e=eio(p(t,a,a+.55));
      $(id).style.clipPath=`inset(0 ${100*(1-e)}% 0 0)`;});
    // zoom final de la banda central
    const z=eio(p(t,25.2,25.9));$('s7b2').style.zIndex=2;
    $('s7b2').style.top=(640-640*z)+'px';$('s7b2').style.height=(640+1280*z)+'px';
    $('s7b2').querySelector('.bc').style.top=(240+640*z)+'px';
  }

  /* 8 CIERRE (26.4 - 31) */
  if(show('s8',t,26.4,31,.2,0)){
    const g=eio(p(t,26.4,27.1)), go=1-p(t,28.0,28.5);
    $('s8h1').style.width=$('s8h2').style.width=(1080*g)+'px';
    $('s8v1').style.height=$('s8v2').style.height=(1920*g)+'px';
    ['s8h1','s8h2','s8v1','s8v2'].forEach(i=>$(i).style.opacity=.25*go);
    const w=eo(p(t,26.6,27.3));$('s8word').style.opacity=w;$('s8word').style.transform=`scale(${.92+.08*w})`;
    const s=eo(p(t,28.2,28.6));$('s8sub').style.opacity=.8*s;$('s8sub').style.letterSpacing=(.18+.14*(1-s))+'em';
    const u=eo(p(t,28.6,29.0));$('s8url').style.opacity=u;$('s8url').style.transform=`translateY(${20*(1-u)}px)`;
    const ig=eo(p(t,28.9,29.3));$('s8ig').style.opacity=.55*ig;
    // fundido final
    $('stage').style.filter=`brightness(${1-p(t,30.4,31)})`;
  } else $('stage').style.filter='';
}
window.render=render;window.DUR=DUR;
// vista previa en navegador
if(!location.search.includes('capture')){const t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop)})();}
</script>
</body>
</html>
